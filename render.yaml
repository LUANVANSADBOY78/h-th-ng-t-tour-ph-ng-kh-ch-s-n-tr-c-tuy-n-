services:
  - type: web
    name: travel-booking-platform
    env: static
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_PATH
        value: /

  - type: web
    name: travel-booking-platform-api
    env: node
    autoDeploy: true
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
