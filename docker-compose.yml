version: '3.8'

services:
  # 1. FRONTEND SERVICE (React / Vite)
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: traveloka_frontend
    ports:
      - "3000:80" # Map port 3000 của máy host vào port 80 của Nginx
    depends_on:
      - backend
    networks:
      - travel_network
    restart: unless-stopped

  # 2. BACKEND SERVICE (NodeJS / Express)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: traveloka_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=traveloka_db
    networks:
      - travel_network
    restart: unless-stopped

  # 3. DATABASE SERVICE (MongoDB)
  db:
    image: mongo:latest
    container_name: traveloka_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: traveloka_db
    volumes:
      - mongo_data:/data/db
    networks:
      - travel_network
    restart: unless-stopped

# Định nghĩa Volumes để lưu trữ dữ liệu DB không bị mất khi tắt container
volumes:
  mongo_data:

# Định nghĩa Network riêng để các service gọi nhau (vd: backend gọi db bằng tên 'db')
networks:
  travel_network:
    driver: bridge
